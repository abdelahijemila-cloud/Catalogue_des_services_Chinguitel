<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogue des services Chinguitel</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f8ff;color:#17356b}header{background:linear-gradient(135deg,#0878df,#6134c7);color:white;padding:32px}main{max-width:1200px;margin:auto;padding:24px}.search{width:100%;padding:16px;border-radius:14px;border:1px solid #ddd;font-size:18px;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{padding:22px;border-radius:18px;color:white;min-height:100px;cursor:pointer}.blue{background:#0878df}.purple{background:#6837c9}.mix{background:linear-gradient(120deg,#0878df,#6837c9)}.yellow{background:#f5b900}.green{background:#12a68a}.orange{background:#ef7d21}.teal{background:#00a8a8}.detail{margin-top:24px;background:white;border-radius:18px;padding:24px;box-shadow:0 5px 25px #ccd6e8}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-bottom:1px solid #e4e8ef;padding:12px 0;gap:8px}.admin{display:inline-block;margin-top:16px;background:white;color:#0878df;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:bold}</style></head><body><header><main><h1>Catalogue des services Chinguitel</h1><p>Tous vos services, au même endroit.</p><input id="search" class="search" placeholder="Rechercher une offre ou un service..."></main></header><main><div id="services" class="grid"></div><div id="detail"></div></main><script>let data=[];const colors=['blue','purple','mix','yellow','green','teal','orange'];async function load(){try{data=await (await fetch('services.json')).json()}catch(e){data=[]}render(data)}function render(items){const box=document.getElementById('services');box.innerHTML=items.map((s,i)=>`<div class="card ${s.color||colors[i%colors.length]}" onclick="show(${i})"><h2>${s.name}</h2><p>${s.description||''}</p></div>`).join('');}function show(i){const s=data[i];document.getElementById('detail').innerHTML=`<div class="detail"><h2>${s.name}</h2><p>${s.description||''}</p>${(s.tables||[]).map(t=>`<h3>${t.title||''}</h3><div class="row"><b>${(t.columns||[]).join('</b><b>')}</b></div>${(t.rows||[]).map(r=>`<div class="row">${r.map(x=>`<span>${x??''}</span>`).join('')}</div>`).join('')}`).join('')}<p><b>Activation :</b> ${s.activation||'Non précisé dans le document'}</p></div>`}document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();render(data.filter(s=>(s.name+' '+(s.keywords||[]).join(' ')).toLowerCase().includes(q)))});load();</script></body></html>
